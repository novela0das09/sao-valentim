<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichas · São Valentim do Vale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow:wght@400;500;600;700&family=Special+Elite&display=swap">
<style>
[hidden] { display: none !important; }
/* layout: barra da cena no topo; fichas | ficha aberta | mesa de dados (no celular, abas) */
:root {
  --bg: #0a0808; --panel: #131010; --panel-2: #1a1515; --line: #2c2222; --line-2: #3d2c2c;
  --paper: #ece4d8; --paper-2: #b9aea2; --muted: #857a72;
  --blood: #b3191f; --on-blood: #ffffff; --red: #e2373d; --red-soft: rgba(226, 55, 61, 0.14);
  --ok: #7fbf6a; --bad: #e2373d; --gold: #e1b45a;
  --f-display: 'IM Fell English SC', 'Times New Roman', serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --f-type: 'Special Elite', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--paper); font: 15px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.5; background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--blood) 10%, transparent), transparent 60%), radial-gradient(ellipse at 100% 100%, color-mix(in srgb, var(--blood) 6%, transparent), transparent 50%); z-index: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* topo */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #120d0d, var(--bg)); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 22px/1 var(--f-display); letter-spacing: 0.02em; color: var(--paper); }
.brand span { font: 12px/1 var(--f-type); color: var(--red); letter-spacing: 0.08em; }
.cena { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cena .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 3px; font-size: 13px; color: var(--paper-2); background: var(--panel); }
.cena .pill b { color: var(--paper); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 3px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--paper); font-weight: 600; font-size: 13.5px; line-height: 1.1; }
.btn:hover { border-color: var(--red); }
.btn.red { background: var(--blood); border-color: var(--blood); color: var(--on-blood); }
.btn.red:hover { background: var(--red); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--paper-2); }
.chk input { accent-color: var(--red); }

/* três colunas */
.main { min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr) 360px; }
.col { min-height: 0; overflow: auto; }
.lista { border-right: 1px solid var(--line); padding: 14px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; }
.lista h3, .dados h3 { margin: 4px 4px 6px; font: 600 11px/1 var(--f-body); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.ficha-it { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 4px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.ficha-it:hover { background: var(--panel); }
.ficha-it.on { background: var(--panel-2); border-color: var(--line-2); box-shadow: inset 3px 0 0 var(--red); }
.ficha-it .av { width: 34px; height: 34px; flex: none; }
.ficha-it b { display: block; font-weight: 600; font-size: 14.5px; }
.ficha-it small { display: block; font-size: 12px; color: var(--muted); }
.av { display: grid; place-items: center; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 30%, #3a2626, #150e0e); border: 1px solid var(--line-2); font: 14px/1 var(--f-display); color: var(--paper-2); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.grp-t { margin: 12px 4px 2px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }

/* ficha */
.ficha { grid-template-columns: minmax(0, 1fr); padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.cab { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: start; }
.retrato { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border: 1px solid var(--line-2); background: radial-gradient(ellipse at 50% 30%, #2a1c1c, #0d0909 75%); overflow: hidden; }
.retrato::after { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--red) 35%, transparent); pointer-events: none; }
.retrato img { width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.05) saturate(0.85); }
.retrato .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 54px/1 var(--f-display); color: rgba(236, 228, 216, 0.4); }
.retrato label { position: absolute; left: 8px; right: 8px; bottom: 8px; text-align: center; font-size: 12px; padding: 5px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--line-2); cursor: pointer; color: var(--paper-2); }
.id { display: grid; gap: 10px; min-width: 0; }
.nome { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nome input { min-width: 0; width: 100%; flex: 1 1 200px; background: none; border: 0; border-bottom: 1px solid transparent; font: 44px/1.05 var(--f-display); color: var(--red); padding: 0; text-shadow: 0 2px 18px color-mix(in srgb, var(--blood) 35%, transparent); }
.nome input:hover, .nome input:focus { border-bottom-color: var(--line-2); outline: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; background: var(--panel); border: 1px solid var(--line-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--paper-2); }
.tag { max-width: 100%; }
.tag select, .tag input { min-width: 0; background: var(--panel-2); border: 1px solid var(--line); padding: 3px 4px; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--paper); max-width: 190px; }
.tag input { width: 52px; }
.tag.perfil { background: var(--blood); border-color: var(--blood); color: var(--on-blood); }
.tag.perfil select { background: rgba(0, 0, 0, 0.25); border-color: rgba(255, 255, 255, 0.25); color: #fff; }
.recursos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rec { padding: 10px 12px; border: 1px solid var(--line-2); background: var(--panel); display: grid; gap: 8px; }
.rec-h { display: flex; align-items: center; gap: 8px; }
.rec-h b { font: 22px/1 var(--f-display); color: var(--red); }
.rec-h .val { font: 600 20px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.rec-h .max { color: var(--muted); font-size: 13px; }
.rec-h .max input { width: 44px; background: var(--panel-2); border: 1px solid var(--line); padding: 2px 4px; font-size: 13px; }
.rec-h .sp { flex: 1; }
.caixas { display: flex; flex-wrap: wrap; gap: 3px; }
.caixa { width: 13px; height: 13px; border: 1.5px solid var(--paper-2); background: transparent; padding: 0; }
.caixa.on { background: var(--red); border-color: var(--red); }
.rec.pd .caixa.on { background: color-mix(in srgb, var(--red) 45%, #c9c3d8); border-color: color-mix(in srgb, var(--red) 45%, #c9c3d8); }
.alerta { font-size: 12.5px; color: var(--red); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line-2); background: var(--panel-2); padding: 0; font-weight: 700; }
.mini:hover { border-color: var(--red); }

/* fita vermelha dos títulos */
.fita { display: inline-block; margin: 0 0 10px; padding: 3px 18px 4px 12px; font: 18px/1.1 var(--f-display); color: var(--on-blood); background: var(--blood); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); letter-spacing: 0.03em; }
.bloco { min-width: 0; }
.duas { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 22px; align-items: start; }
.pilha { display: grid; gap: 20px; min-width: 0; align-content: start; }

/* atributos */
.atribs { display: grid; gap: 4px; }
.atr { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.atr button.nm { background: none; border: 0; padding: 0; text-align: left; font: 28px/1 var(--f-display); color: var(--paper); }
.atr button.nm:hover { color: var(--red); }
.atr .red { font-size: 11.5px; color: var(--red); margin-left: 8px; font-family: var(--f-body); }
.atr .boost { font-size: 11.5px; color: var(--gold); margin-left: 8px; font-family: var(--f-body); }
.die-ctl { display: inline-flex; align-items: center; gap: 4px; }
.die-ctl .mini { width: 22px; height: 22px; font-size: 13px; }

/* perícias */
.pericias { display: grid; }
.per { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 2px; }
.per:nth-child(odd) { background: rgba(255, 255, 255, 0.015); }
.per button.nm { background: none; border: 0; padding: 2px 0; text-align: left; font: 14.5px/1.2 var(--f-type); color: var(--paper); text-transform: uppercase; letter-spacing: 0.04em; min-width: 0; }
.per button.nm:hover { color: var(--red); }
.per .base { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; width: 52px; text-align: right; }
.per.treinada button.nm { color: #fff; }
.per.sub { padding-left: 18px; }
.per.sub button.nm { font-size: 13px; color: var(--paper-2); }
.apt-t { display: flex; align-items: center; gap: 8px; padding: 4px; font: 14.5px/1.2 var(--f-type); text-transform: uppercase; letter-spacing: 0.04em; color: var(--paper-2); }
.legenda { margin-top: 8px; font-size: 12px; color: var(--muted); }

/* ícones de dado */
.dado { display: inline-block; vertical-align: middle; }
.dado svg { display: block; }

/* habilidades, armas, itens */
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line-2); background: var(--panel); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--blood) 90%, transparent), color-mix(in srgb, var(--blood) 35%, transparent)); }
.card-h b { font: 16px/1.1 var(--f-display); letter-spacing: 0.03em; color: #fff; }
.card-h .sp { flex: 1; }
.card-h small { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.75); }
.card-b { padding: 9px 11px 11px; display: grid; gap: 8px; font-size: 14px; color: var(--paper-2); }
.card-b p { margin: 0; }
.card-b strong { color: var(--paper); }
.barra { display: flex; gap: 5px; align-items: center; }
.barra i { width: 26px; height: 12px; border: 1.5px solid var(--red); transform: skewX(-18deg); }
.barra i.on { background: var(--red); box-shadow: 0 0 10px color-mix(in srgb, var(--red) 60%, transparent); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.add-hab { display: flex; gap: 6px; }
.add-hab select { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line-2); padding: 6px; }
.arma { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.arma:last-child { border-bottom: 0; }
.arma b { color: var(--paper); font-weight: 600; }
.arma .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.arma .meta span b { color: var(--paper-2); font-weight: 600; }
.edit-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.edit-grid label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.edit-grid input, .edit-grid select { background: var(--panel-2); border: 1px solid var(--line); padding: 5px 6px; font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--paper); min-width: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.item:last-child { border-bottom: 0; }
.item input.nm { background: none; border: 0; border-bottom: 1px solid transparent; color: var(--paper); min-width: 0; width: 100%; padding: 2px 0; }
.item input.nm:focus { border-bottom-color: var(--line-2); outline: none; }
.cargas { display: inline-flex; gap: 3px; }
.cargas i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold); }
.cargas i.on { background: var(--gold); }
.apr { display: grid; gap: 8px; }
.apr-nota { margin: 0; font-size: 12.5px; color: var(--muted); }
.apr-campo { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.apr-campo input, .apr-campo textarea { background: var(--panel); border: 1px solid var(--line-2); color: var(--paper); padding: 7px 9px; font: 14px/1.5 var(--f-body); width: 100%; box-sizing: border-box; }
.apr-campo textarea { min-height: 62px; resize: vertical; }
textarea.notas { width: 100%; min-height: 120px; resize: vertical; background: var(--panel); border: 1px solid var(--line-2); padding: 10px 12px; color: var(--paper); font: 14px/1.55 var(--f-type); }

/* mesa de dados */
.dados { border-left: 1px solid var(--line); padding: 14px 14px 30px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; background: linear-gradient(180deg, #100c0c, var(--bg)); }
.montar { border: 1px solid var(--line-2); background: var(--panel); padding: 12px; display: grid; gap: 10px; }
.montar .quem { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.montar .quem b { color: var(--paper); }
.sel2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sel2 label, .campo { display: grid; gap: 3px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sel2 select, .campo select, .campo input { background: var(--panel-2); border: 1px solid var(--line-2); padding: 6px; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--paper); min-width: 0; }
.formula { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px; background: #0d0a0a; border: 1px dashed var(--line-2); min-height: 52px; }
.formula .mais { color: var(--muted); font-weight: 700; }
.formula .ext { position: relative; }
.formula .ext button { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: 0; background: var(--blood); color: var(--on-blood); font-size: 11px; line-height: 16px; padding: 0; }
.formula .cnt { margin-left: auto; font-size: 12px; color: var(--muted); }
.passos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.passos .par { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.passos .mini { width: 22px; height: 22px; }
.extras { display: flex; flex-wrap: wrap; gap: 6px; }
.extras .btn { font-weight: 500; }
.extras .btn small { color: var(--muted); font-weight: 400; }
.dt { display: flex; align-items: center; gap: 8px; }
.dt input { width: 56px; background: var(--panel-2); border: 1px solid var(--line-2); padding: 6px; text-align: center; font-weight: 700; color: var(--paper); }
.rolar { width: 100%; padding: 11px; font: 20px/1 var(--f-display); letter-spacing: 0.04em; }
.res { border: 1px solid var(--line-2); background: var(--panel); padding: 12px; display: grid; gap: 10px; }
.res.ok { border-color: rgba(127, 191, 106, 0.55); }
.res.bad { border-color: color-mix(in srgb, var(--red) 60%, transparent); }
.res.crit { border-color: var(--gold); box-shadow: 0 0 24px rgba(225, 180, 90, 0.18); }
.res-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.res-h .tot { font: 46px/1 var(--f-display); color: var(--paper); font-variant-numeric: tabular-nums; }
.res-h .vs { color: var(--muted); font-size: 14px; }
.veredito { font: 18px/1 var(--f-display); letter-spacing: 0.04em; padding: 4px 10px; }
.veredito.ok { color: #0a0808; background: var(--ok); }
.veredito.bad { color: var(--on-blood); background: var(--blood); }
.veredito.crit { color: #0a0808; background: var(--gold); }
.res-dados { display: flex; gap: 8px; flex-wrap: wrap; }
.res-dados button { background: none; border: 0; padding: 0; position: relative; }
.res-dados button.fora { opacity: 0.35; }
.res-dados button.troca::after { content: "↻"; position: absolute; top: -4px; right: -4px; font-size: 13px; color: var(--gold); }
.rarb { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.rarb b { color: var(--paper); font-size: 16px; }
.dano { padding: 8px 10px; background: var(--red-soft); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent); font-size: 14px; }
.dano b { font: 22px/1 var(--f-display); color: var(--red); }
.res-msg { font-size: 13.5px; color: var(--paper-2); }
.tabela-fc { font-size: 13px; padding: 8px 10px; background: #0d0a0a; border: 1px solid var(--line-2); }
.hist { display: grid; gap: 4px; }
.hist-it { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.hist-it .t { font: 600 18px/1 var(--f-body); width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.hist-it .w { min-width: 0; }
.hist-it .w b { display: block; color: var(--paper); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-it .w small { color: var(--muted); }
.hist-it .v { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.hist-it .v.ok { color: var(--ok); } .hist-it .v.bad { color: var(--red); } .hist-it .v.crit { color: var(--gold); }
.livres { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.livres button { display: grid; justify-items: center; gap: 3px; padding: 6px 2px; background: var(--panel); border: 1px solid var(--line-2); font-size: 11.5px; color: var(--paper-2); }
.livres button:hover { border-color: var(--red); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: min(92vw, 440px); padding: 10px 14px; background: #1f1717; border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); font-size: 14px; }
.nota-proto { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
@keyframes giro { 0% { transform: rotate(0) scale(0.8); } 60% { transform: rotate(250deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
.girando { animation: giro 0.55s cubic-bezier(.2, .7, .2, 1); }
@media (prefers-reduced-motion: reduce) { .girando { animation: none; } }

/* abas do celular */
.abas { display: none; }
@media (max-width: 1180px) { .main { grid-template-columns: 200px minmax(0, 1fr) 330px; } .duas { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 920px) {
  .app { grid-template-rows: auto auto 1fr; }
  .abas { display: flex; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 4px; }
  .abas button { flex: 1; padding: 10px 6px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; }
  .abas button.on { color: var(--paper); border-bottom-color: var(--red); }
  .main { grid-template-columns: minmax(0, 1fr); }
  .main > .col { display: none; }
  .main > .col.vis { display: grid; }
  .lista, .dados { border: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cena { margin-left: 0; }
}
@media (max-width: 560px) {
  .cab { grid-template-columns: minmax(0, 1fr); }
  .retrato { width: 150px; }

<script>
/* ===================== regras de Ordem Paranormal 2 (playtest beta 1.1, com os nomes modernos do alpha) ===================== */
const ESCADA = ['d4', 'd6', 'd8', 'd10', 'd12'];

function recebe(l) {
  l = JSON.parse(JSON.stringify(l || []));
  const ids = new Set(l.map(f => f.id));
  let mudou = false;
  for (const nf of l) {
    const js = JSON.stringify(nf), atual = S.fichas.find(f => f.id === nf.id);
    if (sincronizado[nf.id] === js) continue;
    if (atual && JSON.stringify(atual) === js) { sincronizado[nf.id] = js; continue; }
    if (atual) { for (const k of Object.keys(atual)) delete atual[k]; Object.assign(atual, nf); normaliza(atual); }
    else { normaliza(nf); S.fichas.push(nf); }
    sincronizado[nf.id] = js; mudou = true;
  }
  const antes = S.fichas.length;
  S.fichas = S.fichas.filter(f => ids.has(f.id) || !sincronizado[f.id]);
  for (const id of Object.keys(sincronizado)) if (!ids.has(id)) delete sincronizado[id];
  if (mudou || S.fichas.length !== antes) {
    if (!S.fichas.some(f => f.id === S.sel)) { S.sel = S.fichas[0]?.id || null; UIS.roll = null; UIS.res = null; }

        gm ? h('button', { class: 'btn sm', type: 'button', onclick: () => novaComo('npc') }, '+ NPC') : null,
        gm ? h('button', { class: 'btn sm', type: 'button', onclick: () => novaComo('inimigo') }, '+ Inimigo') : null),
      h('p', { class: 'nota-proto' }, gm ? 'Você vê todas as fichas da mesa. NPCs e inimigos ficam escondidos dos jogadores até você marcar “Visível”.' : 'Suas fichas ficam guardadas na mesa. O mestre vê e pode ajustar.'));
  };
  /* jogador olhando o personagem de outro: só nome, retrato, idade, aparência e breve descrição */
  function verOutro() {
    if (PONTE.isGM() || !UIS.outro) return false;
    const o = PONTE.outros().find(x => x.id === UIS.outro);
    if (!o) { UIS.outro = null; return false; }
    fill($('#ficha'), h('div', { class: 'perfil-outro', style: o.cor ? { '--cor-f': o.cor } : null },
      h('div', { class: 'ponte' }, h('span', { class: 'tag-papel' }, 'PERSONAGEM DE ' + String(o.jogador).split(' ')[0].toUpperCase()), h('span', null, 'Você vê só a apresentação. O resto da ficha é do jogador e do mestre.'), h('span', { class: 'sp' }),
        S.fichas.length ? h('button', { class: 'btn sm', type: 'button', onclick: () => { UIS.outro = null; renderTudo(); } }, 'Voltar para a sua ficha') : null),
      h('div', { class: 'po-corpo' },
        h('div', { class: 'retrato' }, o.retrato ? h('img', { src: o.retrato, alt: 'Retrato de ' + o.nome }) : h('div', { class: 'ini' }, ini(o.nome))),
        h('div', { class: 'po-txt' }, h('h2', null, o.nome), o.idade ? h('p', { class: 'po-idade' }, o.idade) : null,
          h('div', { class: 'po-k' }, 'Aparência'), h('p', null, o.aparencia || 'O jogador ainda não descreveu.'),
          h('div', { class: 'po-k' }, 'Quem é'), h('p', null, o.resumo || 'O jogador ainda não escreveu.')))));
    return true;
  }
  /* a cor é pessoal: cada um vê o site na cor da PRÓPRIA ficha. Abrir a ficha de outra pessoa (o mestre abrindo a do
     jogador, por exemplo) não muda nada. O mestre, sem ficha própria, fica no vermelho padrão. */
  function minhaCor() {
    const me = PONTE.me().uid, f = F();
    const minha = f && f.dono === me ? f : S.fichas.find(x => x.dono === me && (x.papel || 'pj') === 'pj');
    return minha && /^#[0-9a-f]{6}$/i.test(minha.cor || '') ? minha.cor : '';
  }
  function temaPessoal() {
    const c = minhaCor();
    try { aplicarTema(c); } catch (e) {}
    try { PONTE.tema && PONTE.tema(c || '#b3191f'); } catch (e) {}
  }
  pintarFicha = function () { temaPessoal(); };
  setTimeout(temaPessoal, 0);
  const renderFicha0 = renderFicha;
  renderFicha = function () {
    if (verOutro()) return;
    renderFicha0();
    temaPessoal();
    const f = F(); if (!f) return;
    const gm = PONTE.isGM(), noMapa = PONTE.temPeca(f.id);
    const mapa = h('button', { class: 'btn sm', type: 'button', onclick: () => { ponteSalvar(true); PONTE.porNoMapa(f.id); } }, noMapa ? 'Ver no mapa' : 'Pôr no mapa');
    let barra;
    if (gm) {
      const papel = h('select', { 'aria-label': 'Papel na mesa', onchange: e => { f.papel = e.target.value; salvar(); renderTudo(); } },
        [['pj', 'Personagem de jogador'], ['npc', 'NPC'], ['inimigo', 'Inimigo']].map(([v, n]) => h('option', { value: v, selected: f.papel === v || null }, n)));
      const extra = f.papel === 'pj'
        ? h('label', null, 'Jogador', h('select', { onchange: e => { f.dono = e.target.value; salvar(); renderTudo(); } },
            h('option', { value: '', selected: !f.dono || null }, '— ninguém ainda —'),
            PONTE.jogadores().map(j => h('option', { value: j.uid, selected: f.dono === j.uid || null }, j.nome)),
            f.dono && !PONTE.jogadores().some(j => j.uid === f.dono) ? h('option', { value: f.dono, selected: true }, PONTE.nomeDe(f.dono)) : null))
        : h('label', { title: 'Mostra o nome, a foto e a peça no mapa para os jogadores. A ficha continua só sua.' }, h('input', { type: 'checkbox', checked: f.visivel || null, onchange: e => { f.visivel = e.target.checked; salvar(); renderTudo(); } }), 'Visível para os jogadores');
      barra = h('div', { class: 'ponte' }, h('label', null, 'Na mesa', papel), extra, h('span', { class: 'sp' }), mapa);
    } else {
      barra = h('div', { class: 'ponte' }, h('span', { class: 'tag-papel' }, 'SUA FICHA'), h('span', null, 'Salva na mesa. O mestre vê as mudanças na hora.'), h('span', { class: 'sp' }), mapa);
    }
    $('#ficha').prepend(barra);
  };
  const off = PONTE.onMuda(recebe);
  const off3 = PONTE.onOutros && PONTE.onOutros(() => { if (!PONTE.isGM()) { renderLista(); if (UIS.outro) renderTudo(); } });
  const off2 = PONTE.onRegras(r => {
    if (!r || r === ultimaRegra) return;
    ultimaRegra = r;
    try { const R = JSON.parse(r); if (R.regras) S.regras = R.regras; S.habCustom = R.habCustom || {}; for (const [k, x] of Object.entries(S.habCustom)) HAB[k] = x; S.vocCustom = R.vocCustom || {}; refazVoc(); aplicarVersao(); salvarLocal(); renderTudo(); } catch (e) {}
  });
  addEventListener('pagehide', () => { try { off(); off2(); } catch (e) {} });
  for (const f of S.fichas) sincronizado[f.id] = JSON.stringify(f);
}
if (UIS.modo === 'regras' && PONTE && !PONTE.isGM()) UIS.modo = 'mesa';
$('#app').dataset.modo = UIS.modo; UIS.aba = ABA_INICIAL[UIS.modo];
renderTudo(); irAba(UIS.aba);
</script>
